<script>
(() => {
  const root = document.documentElement;
  const theme = localStorage.getItem('vaultlite-theme');
  if (theme === 'dark' || theme === 'light') root.dataset.theme = theme;
  const storedNav = localStorage.getItem('vaultlite-sidebar-hidden');
  const mobile = window.matchMedia('(max-width: 760px)').matches;
  // The mobile navigator is a drawer, so it always starts closed. Desktop
  // keeps the user's persisted sidebar preference.
  root.dataset.navHidden = String(mobile || storedNav === '1');
  root.dataset.rightHidden = String(localStorage.getItem('vaultlite-right-sidebar-hidden') === '1');
})();
</script>
